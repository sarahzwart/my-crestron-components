<template id="contract_v1.Audio.Audio">

	 		<ch5-slider sendEventOnChange="Audio.Master_Volume" receiveStateValue="Audio.Master_Volume_FB">
        	</ch5-slider>

	 		<ch5-button sendEventOnClick="Audio.Volume_5_Mute" receiveStateSelected="Audio.Volume_5_Mute_FB">
        	</ch5-button>
	 		<ch5-button sendEventOnClick="Audio.Volume_6_Mute" receiveStateSelected="Audio.Volume_6_Mute_FB">
        	</ch5-button>
